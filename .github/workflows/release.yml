name: Release

# Every push to main (direct commit or merged PR) is tested, then released:
# version bumped, CHANGELOG.md updated, commit tagged vX.Y.Z and a GitHub Release created.
# See scripts/release.py for the versioning rules.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default: the tests job installs packages from PyPI and runs them, so it must never hold a
# token that can push to main. Only the release job, which runs nothing but repo code, may write.
permissions:
  contents: read

jobs:
  tests:
    # The release commit is pushed with the deploy key, which (unlike GITHUB_TOKEN) does trigger this workflow
    # again; skipping tests here also skips the release job, so it doesn't release itself.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          # main is protected by a ruleset (PRs + required checks) whose bypass list allows deploy keys; the
          # release commit can't come through a PR, so it is pushed over SSH with this write deploy key.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - id: prepare
        run: python scripts/release.py --notes-file "$RUNNER_TEMP/notes.md"

      - name: Commit, tag and push
        if: steps.prepare.outputs.released == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pyproject.toml custom_components/truenas_lightweight/manifest.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          # Atomic: never leave a tag pushed without its release commit on main.
          git push --atomic origin HEAD:${{ github.ref_name }} "v${VERSION}"

      - name: Create GitHub release
        if: steps.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
