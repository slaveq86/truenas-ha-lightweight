name: Tests

on:
  pull_request:
  # Pushes to main are tested by release.yml before releasing.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Don't leave the token in .git/config for the PyPI packages installed below.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
